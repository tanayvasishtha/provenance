[project]
name = "provenance"
version = "0.1.0"
description = "Trace a drug in shortage and its substitutes to the plants that make them, in FalkorDB."
readme = "README.md"
authors = [
    { name = "Tanay Vasishtha", email = "tanayvasishtha@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "falkordb>=1.8.0",
    "fastapi>=0.143.2",
    "fastembed>=0.9.0",
    "httpx>=0.28.1",
    "lxml>=6.1.3",
    "pydantic-settings>=2.16.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
provenance = "provenance:main"

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
